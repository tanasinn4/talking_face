<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>MP3＆長押し口パクプレイヤー</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      color: #fff;
      font-family: sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      background: #fff url("background.jpg") center center / contain no-repeat;
    }

    #character {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    #character img {
      display: block;
      margin: auto;
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .face {
      font-size: 120px;
      line-height: 1;
      text-align: center;
      color: #000;
    }

    /* 画面左1/3の操作領域 */
    #leftArea {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 33.3333%;
      z-index: 10;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Androidステータスバー被り回避のため下に配置 */
    #toggleSettingsBtn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 72px);
      right: 16px;
      z-index: 50;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 10px;
      background: #20252b;
      color: #9de5a5;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #settingsPanel {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 126px);
      right: 16px;
      z-index: 50;
      width: min(340px, calc(100vw - 32px));
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - 144px);
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
      background: #303840;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      touch-action: auto;
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel p {
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #status {
      font-size: 15px;
      color: #9de5a5;
      margin: 8px 0;
      word-break: break-word;
    }

    .panel-btn {
      padding: 10px 16px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      background: #65b875;
      color: #fff;
      cursor: pointer;
    }

    .panel-btn.sub {
      background: #475569;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      margin: 12px 0;
    }

    input[type=file] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .guide {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <main id="screen" aria-label="口パクプレイヤー">
    <div id="leftArea"></div>
  </main>

  <div id="character">
    <div class="face" id="face">😐</div>
  </div>

  <button type="button" id="toggleSettingsBtn"> </button>

  <aside id="settingsPanel" aria-label="表示・操作設定">
    <div id="status">待機中</div>
    <div class="guide">
      【左1/3エリア】<br>
      上スワイプ：次の音 ／ 下スワイプ：前の音<br>
      タップ：再生・停止 ／ 長押し：口パク
    </div>

    <div>
      <button type="button" class="panel-btn sub" id="fullscreenBtn">全画面切替</button>
    </div>

    <hr>

    <p>口を閉じた画像</p>
    <input type="file" id="closedFile" accept="image/*">

    <p>口を開いた画像</p>
    <input type="file" id="openFile" accept="image/*">
  </aside>

  <script>
    const speeches = [
      "audio/01_opening.mp3",
      "audio/02_kanpai.mp3",
      "audio/03_kensyu.mp3",
      "audio/04_circus_1.mp3",
      "audio/05_circus_2.mp3",
      "audio/06_hanashiro.mp3",
      "audio/07_photo.mp3",
      "audio/08_pv.mp3",
      "audio/09_omiyasong.mp3",
      "audio/10_kishidan.mp3",
      "audio/11_ending.mp3"
    ];

    const DEFAULT_CLOSED_IMAGE = "image/closed.png";
    const DEFAULT_OPEN_IMAGE = "image/open.png";

    const MOUTH_INTERVAL_MS = 140;
    const SWIPE_THRESHOLD_PX = 40;
    const LONG_PRESS_DELAY_MS = 220;

    let current = 0;
    const player = new Audio();
    player.preload = "auto";
    let wakeLock = null;

    let isMp3Playing = false;
    let isLongPressing = false;
    let mouthOpen = false;
    let mouthTimer = null;

    let closedImage = null;
    let openImage = null;

    const character = document.getElementById("character");
    const statusEl = document.getElementById("status");
    const leftArea = document.getElementById("leftArea");
    const toggleSettingsBtn = document.getElementById("toggleSettingsBtn");
    const settingsPanel = document.getElementById("settingsPanel");

    function updateFace() {
      const shouldOpen = (isMp3Playing || isLongPressing) && mouthOpen;
      const targetImg = shouldOpen ? openImage : closedImage;

      if (targetImg) {
        if (character.firstElementChild !== targetImg) {
          character.replaceChildren(targetImg);
        }
      } else {
        let faceEl = character.querySelector(".face");
        if (!faceEl) {
          faceEl = document.createElement("div");
          faceEl.className = "face";
          character.replaceChildren(faceEl);
        }
        faceEl.textContent = shouldOpen ? "😮" : "😐";
      }
    }

    function updateStatus() {
      if (isLongPressing && isMp3Playing) {
        statusEl.textContent = "長押し口パク + MP3再生中";
      } else if (isLongPressing) {
        statusEl.textContent = "長押し口パク中";
      } else if (isMp3Playing) {
        statusEl.textContent = `MP3再生中 (${current + 1}/${speeches.length})`;
      } else {
        statusEl.textContent = "待機中";
      }
    }

    function syncMouthLoop() {
      const active = isMp3Playing || isLongPressing;
      if (active) {
        if (!mouthTimer) {
          mouthOpen = true;
          updateFace();
          mouthTimer = setInterval(() => {
            if (!(isMp3Playing || isLongPressing)) {
              clearInterval(mouthTimer);
              mouthTimer = null;
              mouthOpen = false;
              updateFace();
              return;
            }
            mouthOpen = !mouthOpen;
            updateFace();
          }, MOUTH_INTERVAL_MS);
        }
      } else {
        if (mouthTimer) {
          clearInterval(mouthTimer);
          mouthTimer = null;
        }
        mouthOpen = false;
        updateFace();
      }
      updateStatus();
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch (_) {}
    }

    function loadAndPlay(index) {
      if (!speeches.length) return;
      current = Math.max(0, Math.min(index, speeches.length - 1));
      player.pause();
      player.src = speeches[current];
      player.currentTime = 0;
      player.play().catch(err => {
        statusEl.textContent = `再生エラー: ${speeches[current]} (${err.name})`;
      });
      requestWakeLock();
    }

    function togglePlayback() {
      if (!speeches.length) return;
      if (!player.src) {
        loadAndPlay(current);
      } else if (player.paused) {
        player.play().catch(err => {
          statusEl.textContent = `再生エラー: ${err.name}`;
        });
        requestWakeLock();
      } else {
        player.pause();
      }
    }

    player.addEventListener("playing", () => {
      isMp3Playing = true;
      syncMouthLoop();
    });
    player.addEventListener("pause", () => {
      isMp3Playing = false;
      syncMouthLoop();
    });
    player.addEventListener("ended", () => {
      isMp3Playing = false;
      syncMouthLoop();
    });
    player.addEventListener("error", () => {
      isMp3Playing = false;
      syncMouthLoop();
      statusEl.textContent = `ファイル読込失敗: ${speeches[current]}`;
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && isMp3Playing) {
        requestWakeLock();
      }
    });

    // 左1/3エリア：タップ・上下スワイプ・長押し
    let activePointerId = null;
    let startX = 0;
    let startY = 0;
    let moved = false;
    let longPressTimer = null;

    function resetGesture() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      if (isLongPressing) {
        isLongPressing = false;
        syncMouthLoop();
      }
      activePointerId = null;
      moved = false;
    }

    leftArea.addEventListener("pointerdown", e => {
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      moved = false;

      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        if (activePointerId !== null && !moved) {
          isLongPressing = true;
          syncMouthLoop();
        }
      }, LONG_PRESS_DELAY_MS);
    });

    window.addEventListener("pointermove", e => {
      if (e.pointerId !== activePointerId) return;
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 14) {
        moved = true;
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }
    });

    window.addEventListener("pointerup", e => {
      if (e.pointerId !== activePointerId) return;
      const dy = e.clientY - startY;
      const wasLongPressing = isLongPressing;
      const wasMoved = moved;

      resetGesture();

      if (wasLongPressing) return;

      if (dy <= -SWIPE_THRESHOLD_PX) {
        if (current < speeches.length - 1) loadAndPlay(current + 1);
        return;
      }

      if (dy >= SWIPE_THRESHOLD_PX) {
        if (current > 0) loadAndPlay(current - 1);
        return;
      }

      if (!wasMoved) {
        togglePlayback();
      }
    });

    window.addEventListener("pointercancel", e => {
      if (e.pointerId === activePointerId) resetGesture();
    });

    window.addEventListener("blur", resetGesture);

    document.addEventListener("contextmenu", event => {
      if (!event.target.closest("#settingsPanel")) event.preventDefault();
    });
    document.addEventListener("gesturestart", event => event.preventDefault());

    // 設定ボタン
    toggleSettingsBtn.addEventListener("pointerup", e => {
      e.preventDefault();
      e.stopPropagation();
      settingsPanel.classList.toggle("open");
    });

    settingsPanel.addEventListener("pointerdown", e => e.stopPropagation());
    settingsPanel.addEventListener("pointerup", e => e.stopPropagation());

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (_) {
        statusEl.textContent = "全画面非対応またはブロックされました";
      }
    }

    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);

    function createImageElement(src, onLoaded, onError) {
      const img = new Image();
      img.onload = () => onLoaded(img);
      if (onError) img.onerror = onError;
      img.src = src;
    }

    if (DEFAULT_CLOSED_IMAGE) {
      createImageElement(
        DEFAULT_CLOSED_IMAGE,
        img => {
          closedImage = img;
          updateFace();
        },
        () => {
          closedImage = null;
          updateFace();
        }
      );
    }
    if (DEFAULT_OPEN_IMAGE) {
      createImageElement(
        DEFAULT_OPEN_IMAGE,
        img => {
          openImage = img;
          updateFace();
        },
        () => {
          openImage = null;
          updateFace();
        }
      );
    }

    function bindFileInput(inputId, onReady) {
      document.getElementById(inputId).addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        createImageElement(url, img => {
          onReady(img);
          URL.revokeObjectURL(url);
        });
      });
    }

    bindFileInput("closedFile", img => {
      closedImage = img;
      updateFace();
    });

    bindFileInput("openFile", img => {
      openImage = img;
      updateFace();
    });

    updateFace();
    updateStatus();
  </script>
</body>
</html>
